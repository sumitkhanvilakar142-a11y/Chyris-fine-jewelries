<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHYRIS | 3D Atelier - Signature Gold Ring</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Spline 3D Viewer Script -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@latest/build/spline-viewer.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0d11;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .studio-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(180deg, rgba(11, 13, 17, 0.8) 0%, transparent 100%);
        }

        .brand-name {
            letter-spacing: 6px;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }

        .back-link {
            color: #d4af37;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 18px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #d4af37;
            color: #111111;
        }

        .spline-stage {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .spline-stage spline-viewer {
            width: 100%;
            height: 100%;
        }

        .floating-details-card {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            background: rgba(17, 20, 27, 0.8);
            backdrop-filter: blur(12px);
            padding: 26px 32px;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .floating-details-card span {
            font-size: 9px;
            letter-spacing: 3px;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .floating-details-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .floating-details-card p {
            font-size: 12px;
            color: #9ba1b0;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-tag {
            font-size: 20px;
            color: #d4af37;
            font-weight: 600;
        }

        .btn-order {
            background: #d4af37;
            color: #111111;
            padding: 10px 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .btn-order:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <header class="studio-nav">
        <a href="index.html" class="brand-name">CHYRIS</a>
        <a href="index.html" class="back-link">← Return to Boutique</a>
    </header>

    <div class="spline-stage">
        <spline-viewer url="https://prod.spline.design/d-5vGhvoWMNdLxeG/scene.splinecode"></spline-viewer>
    </div>

    <div class="floating-details-card">
        <span>3D Bespoke Studio</span>
        <h3>18K Gold Signature Ring</h3>
        <p>Interactive 3D model. Drag to rotate 360°, scroll to zoom, and inspect certified craftsmanship.</p>
        <div class="card-bottom">
            <div class="price-tag">₹ 78,500</div>
            <a href="cart.html" class="btn-order">Reserve Piece</a>
        </div>
    </div>
</body>
</html>
